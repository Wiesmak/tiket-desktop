syntax = "proto3";

package pl.umamusume.tiket.api.v1;
option java_package = "pl.umamusume.tiket.contracts.v1";
option java_multiple_files = true;
option java_outer_classname = "SystemProto";

service SystemService {
  // Public process/API ping without domain or database side effects.
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}

message PingResponse {
  string status = 1;
  string api_version = 2;
}
