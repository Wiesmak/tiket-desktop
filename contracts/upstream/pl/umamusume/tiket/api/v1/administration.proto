syntax = "proto3";
package pl.umamusume.tiket.api.v1;
option java_package = "pl.umamusume.tiket.contracts.v1";
option java_multiple_files = true;

enum PoolType { POOL_TYPE_UNSPECIFIED = 0; WIN = 1; QUINELLA = 2; EXACTA = 3; TRIFECTA = 4; }
enum NoWinnerPolicy { NO_WINNER_POLICY_UNSPECIFIED = 0; HOUSE_RETAINS_POOL = 1; }
enum DayPhase { DAY_PHASE_UNSPECIFIED = 0; DRAFT = 1; READY = 2; RUNNING = 3; FINALIZING = 4; COMPLETED = 5; CLOSED = 6; }
enum RacePhase { RACE_PHASE_UNSPECIFIED = 0; SCHEDULED = 1; BETTING_OPEN = 2; BETTING_CLOSED = 3; RESULT_PROPOSED = 4; RESULT_VERIFIED = 5; SETTLED = 6; VOIDED = 7; }
message Runner { string horse_id = 1; string program_number = 2; string display_name = 3; }
message PoolConfiguration { PoolType type = 1; int64 unit_stake = 2; int32 take_basis_points = 3; }
message RaceConfiguration {
 string race_id = 1; int32 number = 2; string racecourse_name = 3; string title = 4;
 repeated Runner runners = 5; repeated PoolConfiguration pools = 6;
}
message RaceDayConfiguration {
 string race_day_id = 1; string event_date = 2; int32 display_number = 3; string currency = 4;
 string time_zone = 5; string rules_version = 6; int32 maximum_coupon_legs = 7;
 int32 maximum_open_races = 8; NoWinnerPolicy no_winner_policy = 9; repeated RaceConfiguration races = 10;
}
message CreateRaceDayRequest { RaceDayConfiguration definition = 1; string idempotency_key = 2; }
message DayQuery { string race_day_id = 1; }
message DayCommand { string race_day_id = 1; int64 expected_version = 2; string idempotency_key = 3; }
message DayAcknowledgement { string race_day_id = 1; DayPhase phase = 2; int64 version = 3; }
message RaceDayInformation { RaceDayConfiguration definition = 1; DayAcknowledgement status = 2; }
message RaceQuery { string race_day_id = 1; string race_id = 2; }
message RaceCommand {
 string race_day_id = 1; string race_id = 2; int64 expected_day_version = 3;
 int64 expected_race_version = 4; string idempotency_key = 5;
}
message RaceAcknowledgement { string race_day_id = 1; string race_id = 2; RacePhase phase = 3; int64 version = 4; repeated string scratched_horse_ids = 5; string selected_result_revision = 6; }
message RaceInformation { RaceConfiguration definition = 1; RaceAcknowledgement status = 2; }
message RaceList { repeated RaceInformation races = 1; }
message EnrollPlayerRequest {
 string race_day_id = 1; string player_id = 2; int64 opening_paid = 3; int64 opening_promotional = 4;
 int64 expected_day_version = 5; string idempotency_key = 6;
}
message AddOpeningFundingRequest {
 string race_day_id = 1; string player_id = 2; int64 additional_paid = 3; int64 additional_promotional = 4;
 int64 expected_account_version = 5; string idempotency_key = 6;
}
message EnrollmentQuery { string race_day_id = 1; string player_id = 2; }
message EnrollmentInformation {
 string race_day_id = 1; string player_id = 2; int64 opening_paid = 3; int64 opening_promotional = 4;
 int64 balance = 5; int64 account_version = 6; int64 opening_version = 7;
}
message PlayerList { repeated EnrollmentInformation players = 1; }
service RaceDayService {
  // Create the complete immutable DRAFT definition.
 rpc CreateRaceDay(CreateRaceDayRequest) returns (DayAcknowledgement);
  // Get Race Day for authorized resources.
 rpc GetRaceDay(DayQuery) returns (RaceDayInformation);
  // Freeze definition and enter READY.
 rpc PublishRaceDay(DayCommand) returns (DayAcknowledgement);
  // Enter RUNNING, freezing enrollment and funding.
 rpc StartRaceDay(DayCommand) returns (DayAcknowledgement);
  // Enter FINALIZING once betting is closed.
 rpc FinalizeRaceDay(DayCommand) returns (DayAcknowledgement);
  // Prove terminal races/pools/legs and enter COMPLETED.
 rpc CompleteRaceDay(DayCommand) returns (DayAcknowledgement);
  // Prove terminal cashouts and enter CLOSED.
 rpc CloseRaceDay(DayCommand) returns (DayAcknowledgement);
}
service RaceService {
  // Refund active legs containing the scratched horse before verification.
 rpc ScratchHorse(ScratchHorseRequest) returns (RefundAcknowledgement);
  // Refund all remaining active legs before verification.
 rpc VoidRace(RaceCommand) returns (RefundAcknowledgement);
  // List Races for authorized resources.
 rpc ListRaces(DayQuery) returns (RaceList);
  // Get Race for authorized resources.
 rpc GetRace(RaceQuery) returns (RaceInformation);
  // Get Race Status for authorized resources.
 rpc GetRaceStatus(RaceQuery) returns (RaceAcknowledgement);
  // Open a scheduled race within the event-wide limit.
 rpc OpenBetting(RaceCommand) returns (RaceAcknowledgement);
  // Close betting before proposals.
 rpc CloseBetting(RaceCommand) returns (RaceAcknowledgement);
}
service EnrollmentService {
  // Enroll with opening funds before start.
 rpc EnrollPlayer(EnrollPlayerRequest) returns (EnrollmentInformation);
  // Append opening funding before start and account activity.
 rpc AddOpeningFunding(AddOpeningFundingRequest) returns (EnrollmentInformation);
  // Get Enrollment for authorized resources.
 rpc GetEnrollment(EnrollmentQuery) returns (EnrollmentInformation);
  // List Players for authorized resources.
 rpc ListPlayers(DayQuery) returns (PlayerList);
}

message ScratchHorseRequest { RaceCommand command = 1; string horse_id = 2; }
message PlayerFinancialSummary { string player_id = 1; int64 amount = 2; }
message PoolRefundSummary { PoolType type = 1; int64 refunded_stake = 2; int64 refunded_units = 3; }
message RefundAcknowledgement {
 RaceAcknowledgement status = 1; int64 refunded_legs = 2; int64 refunded_stake = 3;
 repeated PlayerFinancialSummary players = 4; repeated PoolRefundSummary pools = 5;
}
enum OfficialResultKind { OFFICIAL_RESULT_KIND_UNSPECIFIED = 0; NORMAL = 1; EXCEPTIONAL = 2; }
enum OfficialResultStatus { OFFICIAL_RESULT_STATUS_UNSPECIFIED = 0; PROPOSED = 1; VERIFIED = 2; }
message SubmitResultRequest {
 RaceCommand command = 1; string revision = 2; repeated string finisher_ids = 3; OfficialResultKind kind = 4;
}
message VerifyResultRequest { RaceCommand command = 1; string revision = 2; }
message OfficialResult {
 string race_day_id = 1; string race_id = 2; string revision = 3;
 repeated string finisher_ids = 4; OfficialResultKind kind = 5; OfficialResultStatus status = 6;
}
message ResultAcknowledgement { RaceAcknowledgement status = 1; OfficialResult result = 2; }
message ResultRevisionsRequest { RaceQuery race = 1; int32 page_size = 2; int32 offset = 3; }
message ResultRevisions { repeated OfficialResult results = 1; optional int32 next_offset = 2; }
message SettleRaceRequest { RaceCommand command = 1; string settlement_id = 2; }
message SettlementQuery { string race_day_id = 1; string race_id = 2; string settlement_id = 3; }
message PoolSettlementSummary {
 PoolType type = 1; int64 valid_stake = 2; int64 winning_units = 3; int64 distributable = 4;
 int64 dividend_per_unit = 5; int64 distributed = 6; int64 house_allocation = 7; int64 pool_version = 8;
}
message SettlementInformation {
 string settlement_id = 1; RaceAcknowledgement status = 2; string result_revision = 3;
 repeated PoolSettlementSummary pools = 4; repeated PlayerFinancialSummary players = 5;
}
enum TerminalLegOutcome { TERMINAL_LEG_OUTCOME_UNSPECIFIED = 0; REFUNDED = 1; WON = 2; LOST = 3; }
message RaceLegResolutionsRequest { RaceQuery race = 1; int32 page_size = 2; int32 offset = 3; }
message TerminalLegResolution { string coupon_id = 1; int32 ordinal = 2; TerminalLegOutcome outcome = 3; int64 amount = 4; string settlement_id = 5; }
message RaceLegResolutions { repeated TerminalLegResolution resolutions = 1; optional int32 next_offset = 2; }
service ResultService {
  // Propose a normal ordered result after betting closes.
 rpc SubmitResult(SubmitResultRequest) returns (ResultAcknowledgement);
  // Verify the selected normal proposal with three or more eligible finishers.
 rpc VerifyResult(VerifyResultRequest) returns (ResultAcknowledgement);
  // Get Result for authorized resources.
 rpc GetResult(RaceQuery) returns (ResultAcknowledgement);
  // List Result Revisions for authorized resources.
 rpc ListResultRevisions(ResultRevisionsRequest) returns (ResultRevisions);
  // Atomically settle four pools from a verified normal result.
 rpc SettleRace(SettleRaceRequest) returns (SettlementInformation);
  // Get Settlement for authorized resources.
 rpc GetSettlement(SettlementQuery) returns (SettlementInformation);
  // List Race Leg Resolutions for authorized resources.
 rpc ListRaceLegResolutions(RaceLegResolutionsRequest) returns (RaceLegResolutions);
}
